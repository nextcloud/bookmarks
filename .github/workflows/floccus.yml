name: Floccus

on:
  pull_request:
  push:
    branches:
      - master
      - stable*
    paths:
      - 'lib/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/floccus.yml'

env:
  APP_NAME: bookmarks

concurrency:
  group: floccus-tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-latest

    strategy:
      # do not stop on another job's failure
      fail-fast: false
      matrix:
        node-version: [ 20.x ]
        npm-version: [ 10.x ]
        floccus-branch: [ 'master', 'develop' ]

    steps:
      - name: Checkout floccus
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          path: floccus
          ref: ${{ matrix.floccus-branch }}
          repository: floccusAddon/floccus

      - name: Set up node ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up npm ${{ matrix.npm-version }}
        run: npm i -g npm@"${{ matrix.npm-version }}"

      - name: Cache node modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm # npm cache files are stored in `~/.npm` on Linux/macOS
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies & build
        working-directory: floccus
        run: |
          npm ci
          npm run build-release --if-present

      - name: Save context
        uses: buildjet/cache/save@3e70d19e31d6a8030aeddf6ed8dbe601f94d09f4 # v4.0.2
        with:
          key: floccus-context-${{ matrix.floccus-branch }}-${{ github.run_id }}
          path: ./

  selenium:
    runs-on: ubuntu-latest
    needs: init

    env:
      SELENIUM_HUB_HOST: hub
      TEST_HOST: nextcloud
      SERVER_BRANCH: ${{ matrix.server-version }}
      MYSQL_PASSWORD: root

    strategy:
      # do not stop on another job's failure
      fail-fast: false
      matrix:
        node-version: [20.x]
        npm-version: [10.x]
        server-version: ['stable32', 'stable35', 'master']
        floccus-branch: ['master', 'develop']
        floccus-adapter:
          - nextcloud-bookmarks
        test-name:
          - test
        browsers:
          - firefox

    name: ${{ matrix.browsers }} floccus@${{ matrix.floccus-branch }} Nextcloud ${{ matrix.server-version }} ${{ matrix.floccus-adapter }}:${{ matrix.test-name}}

    services:
      hub:
        image: selenium/hub:4.11.0-20230801
        ports:
          - 4442:4442
          - 4443:4443
          - 4444:4444
      firefox:
        image: selenium/node-firefox:4.11.0-20230801

        env:
          SE_EVENT_BUS_HOST: hub
          SE_EVENT_BUS_PUBLISH_PORT: 4442
          SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
        options: --shm-size="2g" --add-host=nextcloud:host-gateway
      chrome:
        image: selenium/node-chrome:4.11.0-20230801
        env:
          SE_EVENT_BUS_HOST: hub
          SE_EVENT_BUS_PUBLISH_PORT: 4442
          SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
        options: --shm-size="2g" --add-host=nextcloud:host-gateway
      mysql:
        image: mariadb:10.11
        ports:
          - 4444:3306/tcp
        env:
          MYSQL_ROOT_PASSWORD: ${{env.MYSQL_PASSWORD}}
        options: --health-cmd="mysqladmin ping" --health-interval 5s --health-timeout 2s --health-retries 10

    steps:

      - name: Set up node ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up npm ${{ matrix.npm-version }}
        run: npm i -g npm@"${{ matrix.npm-version }}"

      - name: Restore context
        uses: buildjet/cache/restore@3e70d19e31d6a8030aeddf6ed8dbe601f94d09f4 # v4.0.2
        with:
          fail-on-cache-miss: true
          key: floccus-context-${{matrix.floccus-branch}}-${{ github.run_id }}
          path: ./

      - name: Checkout Nextcloud source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          repository: nextcloud/server
          ref: ${{ matrix.server-version }}
          submodules: true
          path: server

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, zip, apcu
          ini-values: apc.enable_cli=1
          coverage: none

      - name: Checkout bookmarks app
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          path: server/apps/${{ env.APP_NAME }}

      - name: Install bookmarks app
        working-directory: server/apps/${{ env.APP_NAME }}
        run: composer install --no-dev

      - name: Install Nextcloud and enable bookmarks
        working-directory: server
        shell: bash
        run: |
          php occ maintenance:install --database=mysql --database-name=nextcloud --database-host=127.0.0.1 --database-port=4444 --database-user=root --database-pass="$MYSQL_PASSWORD" --admin-user=admin --admin-pass=admin
          php occ config:system:set trusted_domains 1 --value=nextcloud
          php occ app:enable ${{ env.APP_NAME }}
          php occ config:system:set --value '\OC\Memcache\APCu' memcache.local
          php occ status

      - name: Serve Nextcloud to the browser containers
        working-directory: server
        run: |
          echo '127.0.0.1 nextcloud' | sudo tee -a /etc/hosts
          sudo env PHP_CLI_SERVER_WORKERS=4 "$(command -v php)" -S 0.0.0.0:80 > "$RUNNER_TEMP/nextcloud-http.log" 2>&1 &
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://nextcloud/status.php

      - name: Wait for Selenium
        run: |
          sudo apt install -y jq
          while ! curl -sSL "http://localhost:4444/wd/hub/status" 2>&1 \
                | jq -r '.value.ready' 2>&1 | grep "true" >/dev/null; do
            echo 'Waiting for the Grid'
            sleep 1
          done

          echo "Selenium Grid is up - executing tests"

      - name: Run tests
        working-directory: floccus
        env:
          SELENIUM_BROWSER: ${{ matrix.browsers }}
          FLOCCUS_TEST: ${{matrix.floccus-adapter}} ${{ matrix.test-name}}
        run: |
          npm run test

      - name: Print Nextcloud logs
        if: always()
        run: |
          cat server/data/nextcloud.log "$RUNNER_TEMP/nextcloud-http.log" 2>/dev/null || true

  summary:
    runs-on: ubuntu-latest-low
    needs: [ init, selenium ]

    if: always()

    name: selenium-summary

    steps:
      - name: Summary status
        run: if ${{ needs.init.result != 'success' || ( needs.selenium.result != 'success' && needs.selenium.result != 'skipped' ) }}; then exit 1; fi
